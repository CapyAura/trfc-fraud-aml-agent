[project]
name = "trfc-agent"
version = "0.1.0"
description = "Trợ lý Kiểm soát Rủi ro & Gian lận Giao dịch — final project AIPR"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "rank_bm25>=0.2.2",
    "tiktoken>=0.7",
    "mcp>=1.0",
]

[project.optional-dependencies]
eval = ["ragas>=0.1", "datasets>=2.20"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
